name: CI

on:
  push:
    branches: [main, master, VerticalSlice-migration]
  pull_request:
    branches: [main, master, VerticalSlice-migration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hochuproect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=hochuproect_test;Username=postgres;Password=postgres
      HOCHU_TEST_PG: Host=localhost;Port=5432;Database=hochuproect_test;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore HochuProect.slnx

      - name: Build
        run: dotnet build HochuProect.slnx --no-restore -c Release

      - name: Test
        run: dotnet test HochuProect.slnx --no-build -c Release --verbosity normal
