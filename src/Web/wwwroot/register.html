<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="auth-shell wrap">
      <form class="auth-panel reveal" id="form">
        <h1>Регистрация</h1>
        <p class="muted">Пароль: от 8 символов, буквы верхнего/нижнего регистра и цифра.</p>
        <div class="field">
          <label class="label" for="displayName">Имя</label>
          <input class="input" id="displayName" required minlength="2" maxlength="100" />
        </div>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <label class="hint" style="display:flex;gap:0.5rem;align-items:flex-start;margin-bottom:1rem">
          <input type="checkbox" id="acceptTerms" required style="margin-top:0.2rem" />
          <span>Я принимаю <a href="/terms.html" target="_blank">Пользовательское соглашение</a> и ознакомлен(а) с <a href="/privacy.html" target="_blank">Политикой конфиденциальности</a>.</span>
        </label>
        <p class="error-text" id="error" hidden></p>
        <button class="btn btn-primary" style="width:100%" type="submit" id="submit">Создать аккаунт</button>
        <p class="muted" style="margin-top:1rem">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
      </form>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await HochuApp.mountShell();
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const error = document.getElementById("error");
        const btn = document.getElementById("submit");
        if (!document.getElementById("acceptTerms").checked) {
          error.textContent = "Необходимо принять соглашение и политику конфиденциальности.";
          error.hidden = false;
          return;
        }
        error.hidden = true;
        HochuApp.setBusy(btn, true);
        try {
          const res = await HochuApi.register(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value,
            document.getElementById("displayName").value.trim(),
            true
          );
          if (res.message) {
            location.href = "/verify-email-sent.html";
            return;
          }
          location.href = "/projects.html";
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          HochuApp.setBusy(btn, false);
        }
      });
    })();
  </script>
</body>
</html>
