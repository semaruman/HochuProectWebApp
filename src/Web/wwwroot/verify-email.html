<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Подтверждение email — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="auth-shell wrap">
      <div class="auth-panel" id="panel">
        <h1>Подтверждение email</h1>
        <p class="muted">Пожалуйста, подождите…</p>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await HochuApp.mountShell();
      const panel = document.getElementById("panel");
      const userId = HochuApp.qs("userId");
      const token = HochuApp.qs("token");
      if (!userId || !token) {
        panel.innerHTML = `<h1>Ошибка</h1><p class="error-text">Ссылка недействительна или просрочена.</p><a href="/login.html">Войти</a>`;
        return;
      }
      try {
        await HochuApi.post("/api/auth/confirm-email", { userId, token });
        panel.innerHTML = `<h1>Email подтверждён</h1><p class="ok-text">Можно войти и пользоваться платформой.</p><a class="btn btn-primary" href="/login.html">Войти</a>`;
      } catch (err) {
        panel.innerHTML = `<h1>Ошибка</h1><p class="error-text">${HochuApp.escapeHtml(err.message)}</p><a href="/login.html">Войти</a>`;
      }
    })();
  </script>
</body>
</html>
