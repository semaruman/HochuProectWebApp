<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новый пароль — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="auth-shell wrap">
      <form class="auth-panel reveal" id="form">
        <h1>Новый пароль</h1>
        <div class="field">
          <label class="label" for="password">Новый пароль</label>
          <input class="input" id="password" type="password" required minlength="8" />
        </div>
        <p class="error-text" id="error" hidden></p>
        <button class="btn btn-primary" style="width:100%" type="submit">Сохранить</button>
      </form>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const email = HochuApp.qs("email");
    const token = HochuApp.qs("token");
    HochuApp.mountShell();
    if (!email || !token) {
      document.querySelector(".auth-panel").innerHTML = `<h1>Ошибка</h1><p class="error-text">Ссылка недействительна.</p><a href="/forgot-password.html">Запросить снова</a>`;
    } else {
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const error = document.getElementById("error");
        error.hidden = true;
        try {
          await HochuApi.post("/api/auth/reset-password", {
            email,
            token,
            newPassword: document.getElementById("password").value
          });
          location.href = "/login.html";
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        }
      });
    }
  </script>
</body>
</html>
