<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Проекты — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="wrap">
      <div class="page-head reveal">
        <div>
          <p class="section__label">Projects</p>
          <h1>Инженерные проекты</h1>
          <p>Открытые задачи на площадке — от 3D-моделирования до расчётов.</p>
        </div>
        <a class="btn btn-primary" href="/create-project.html">Создать проект</a>
      </div>

      <div class="toolbar reveal">
        <label class="search-glass" style="flex:1;max-width:520px">
          <span class="search-glass__icon" aria-hidden="true">⌕</span>
          <input class="input" id="q" type="search" placeholder="Поиск по названию, навыкам, дисциплине…" autocomplete="off" />
          <kbd class="search-glass__kbd">/</kbd>
        </label>
        <select class="select" id="category" aria-label="Категория"></select>
        <button class="btn btn-ghost" id="reload" type="button">Обновить</button>
      </div>

      <div class="list list--grid" id="list">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadCategories() {
      const items = await HochuApi.get("/api/categories");
      const select = document.getElementById("category");
      select.innerHTML = `<option value="">Все категории</option>` +
        items.map(c => `<option value="${c.id}">${HochuApp.escapeHtml(c.name)}</option>`).join("");
    }

    async function loadProjects() {
      const list = document.getElementById("list");
      list.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
      const q = document.getElementById("q").value.trim();
      const categoryId = document.getElementById("category").value;
      const params = new URLSearchParams({ page: "1", pageSize: "30" });
      if (q) params.set("q", q);
      if (categoryId) params.set("categoryId", categoryId);
      try {
        const data = await HochuApi.get(`/api/projects?${params}`);
        if (!data.items?.length) {
          list.innerHTML = `
            <div class="empty glass-card" style="grid-column:1/-1">
              <div class="empty__icon">◇</div>
              <p>Пока нет опубликованных проектов.</p>
              <a class="btn btn-primary" href="/create-project.html" style="margin-top:var(--space-4)">Создать первый проект</a>
            </div>`;
          return;
        }
        list.innerHTML = data.items.map(p => HochuApp.projectCard(p)).join("");
        if (window.HochuEffects) {
          HochuEffects.mountReveal();
          HochuEffects.mountCardTilt();
        }
      } catch (err) {
        list.innerHTML = `<div class="empty glass-card" style="grid-column:1/-1">${HochuApp.escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("reload").addEventListener("click", loadProjects);
    document.getElementById("q").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadProjects();
    });
    document.getElementById("category").addEventListener("change", loadProjects);

    (async () => {
      await HochuApp.mountShell({ active: "projects" });
      await loadCategories();
      await loadProjects();
    })();
  </script>
</body>
</html>
