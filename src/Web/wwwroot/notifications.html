<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Уведомления — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1>Уведомления</h1>
          <p>События по проектам и сделкам.</p>
        </div>
        <button class="btn btn-ghost" id="read-all" type="button">Прочитать все</button>
      </div>
      <div class="list" id="list"><div class="skeleton"></div></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    function mapLink(url) {
      if (!url) return null;
      if (url.startsWith("/Deals/Details/")) return `/deal.html?id=${url.split("/").pop()}`;
      if (url.startsWith("/Projects/Bids/")) return `/project.html?id=${url.split("/").pop()}`;
      if (url.startsWith("/Projects/Details/")) return `/project.html?id=${url.split("/").pop()}`;
      return url;
    }

    async function load() {
      const list = document.getElementById("list");
      try {
        const items = await HochuApi.get("/api/notifications");
        if (!items.length) {
          list.innerHTML = `<div class="empty">Уведомлений нет.</div>`;
          return;
        }
        list.innerHTML = items.map(n => {
          const href = mapLink(n.linkUrl);
          const inner = `
            <div class="item__title">${HochuApp.escapeHtml(n.title)}</div>
            <div class="item__meta">
              ${n.isRead ? `<span class="badge">Прочитано</span>` : `<span class="badge badge--accent">Новое</span>`}
              <span>${HochuApp.formatDate(n.createdAt)}</span>
            </div>
            <p class="muted" style="margin:0.35rem 0 0">${HochuApp.escapeHtml(n.body)}</p>`;
          return href
            ? `<a class="item" href="${href}" data-id="${n.id}">${inner}</a>`
            : `<div class="item" data-id="${n.id}">${inner}</div>`;
        }).join("");

        list.querySelectorAll("[data-id]").forEach(el => {
          el.addEventListener("click", () => {
            HochuApi.post(`/api/notifications/${el.dataset.id}/read`).catch(() => {});
          });
        });
      } catch (err) {
        list.innerHTML = `<div class="empty">${HochuApp.escapeHtml(err.message)}</div>`;
      }
    }

    (async () => {
      await HochuApp.mountShell({ active: "notifications" });
      if (!HochuApp.requireAuthOrRedirect()) return;
      document.getElementById("read-all").addEventListener("click", async () => {
        try {
          await HochuApi.post("/api/notifications/read-all");
          await load();
        } catch (err) {
          HochuApp.toast(err.message, true);
        }
      });
      await load();
    })();
  </script>
</body>
</html>
