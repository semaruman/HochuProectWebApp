<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Услуги — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1>Услуги</h1>
          <p>Готовые предложения инженеров.</p>
        </div>
      </div>
      <div class="list" id="list"><div class="skeleton"></div></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await HochuApp.mountShell({ active: "services" });
      const list = document.getElementById("list");
      try {
        const data = await HochuApi.get("/api/services?page=1&pageSize=40");
        if (!data.items?.length) {
          list.innerHTML = `<div class="empty">Опубликованных услуг пока нет.</div>`;
          return;
        }
        list.innerHTML = data.items.map(s => `
          <div class="item">
            <div class="item__title">${HochuApp.escapeHtml(s.title)}</div>
            <div class="item__meta">
              <span class="badge badge--accent">${HochuApp.escapeHtml(s.category?.name || "Услуга")}</span>
              <span>${HochuApp.money(s.price)}</span>
              <span>${s.deliveryDays} дн.</span>
            </div>
          </div>`).join("");
      } catch (err) {
        list.innerHTML = `<div class="empty">${HochuApp.escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
