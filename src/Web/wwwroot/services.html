<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Услуги — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="wrap">
      <div class="page-head reveal">
        <div>
          <p class="section__label">Engineers</p>
          <h1>Услуги инженеров</h1>
          <p>Готовые предложения от специалистов площадки.</p>
        </div>
      </div>
      <div class="list list--grid" id="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await HochuApp.mountShell({ active: "services" });
      const list = document.getElementById("list");
      try {
        const data = await HochuApi.get("/api/services?page=1&pageSize=40");
        if (!data.items?.length) {
          list.innerHTML = `
            <div class="empty glass-card" style="grid-column:1/-1">
              <div class="empty__icon">◈</div>
              <p>Опубликованных услуг пока нет.</p>
            </div>`;
          return;
        }
        list.innerHTML = data.items.map(s => HochuApp.serviceCard(s)).join("");
      } catch (err) {
        list.innerHTML = `<div class="empty">${HochuApp.escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
