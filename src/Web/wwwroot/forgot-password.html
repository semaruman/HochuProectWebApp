<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сброс пароля — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="auth-shell wrap">
      <form class="auth-panel" id="form">
        <h1>Забыли пароль?</h1>
        <p class="muted">Введите email — мы отправим ссылку для сброса.</p>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" required />
        </div>
        <p class="error-text" id="error" hidden></p>
        <p class="ok-text" id="ok" hidden></p>
        <button class="btn btn-primary" style="width:100%" type="submit">Отправить</button>
        <p class="muted" style="margin-top:1rem"><a href="/login.html">Вернуться ко входу</a></p>
      </form>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    HochuApp.mountShell();
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const error = document.getElementById("error");
      const ok = document.getElementById("ok");
      error.hidden = true;
      ok.hidden = true;
      try {
        await HochuApi.post("/api/auth/forgot-password", { email: document.getElementById("email").value.trim() });
        ok.textContent = "Если email зарегистрирован, мы отправили ссылку для сброса пароля.";
        ok.hidden = false;
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
