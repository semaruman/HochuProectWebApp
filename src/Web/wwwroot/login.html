<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Хочу Проект</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="main">
    <div class="auth-shell wrap">
      <form class="auth-panel reveal" id="form">
        <h1>Вход</h1>
        <p class="muted">Войдите, чтобы создавать проекты и сделки.</p>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" type="password" required autocomplete="current-password" />
        </div>
        <p class="error-text" id="error" hidden></p>
        <button class="btn btn-primary" style="width:100%" type="submit" id="submit">Войти</button>
        <p class="muted" style="margin-top:1rem">Нет аккаунта? <a href="/register.html">Регистрация</a> · <a href="/forgot-password.html">Забыли пароль?</a></p>
      </form>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      await HochuApp.mountShell({ active: "login" });
      if (HochuApp.getUserId()) {
        location.href = HochuApp.qs("returnUrl") || "/projects.html";
        return;
      }
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const error = document.getElementById("error");
        const btn = document.getElementById("submit");
        error.hidden = true;
        HochuApp.setBusy(btn, true);
        try {
          await HochuApi.login(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );
          location.href = HochuApp.qs("returnUrl") || "/projects.html";
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
          HochuApp.setBusy(btn, false);
        }
      });
    })();
  </script>
</body>
</html>
